<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Secure Academy</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;">
  <tr>
    <td align="center" style="padding:32px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
        <tr>
          <td style="font-size:15px;line-height:1.7;color:#1a1a1a;">
            <p style="margin:0 0 16px;">Hi {{ first_name }},</p>
            {% for para in paragraphs %}
            <p style="margin:0 0 16px;">{{ para|safe }}</p>
            {% endfor %}
            <p style="margin:0 0 4px;">{{ sign_off }}</p>
            <p style="margin:0;color:#555555;">{{ sender_name }}<br>{{ sender_title }}</p>
          </td>
        </tr>
        <tr>
          <td style="padding-top:36px;">
            <p style="margin:0;font-size:11.5px;line-height:1.6;color:#9a9a9a;">You're getting this because you signed up at Code Secure Academy. <a href="{{ unsubscribe_url }}" style="color:#9a9a9a;">Unsubscribe</a></p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
