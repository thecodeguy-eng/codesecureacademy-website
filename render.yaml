services:
  - type: web
    name: csa-platform
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn csa_platform.wsgi --log-file -"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DEBUG
        value: "False"
      # Everything else (SECRET_KEY, DATABASE_URL, PAYSTACK_*, CLOUDINARY_*, etc.)
      # is set manually in the Render dashboard from .env.example — see README.
